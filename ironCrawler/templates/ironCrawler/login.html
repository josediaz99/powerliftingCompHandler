<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin login — IronCrawler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'ironCrawler/style.css' %}">
</head>
<body>
<div class="page">

  <div class="topbar">
    <a class="back" href="{% url 'index' %}">
      <span class="chev">&lsaquo;</span><span>Meets</span>
    </a>
  </div>

  <div class="prompt-title">Admin login</div>
  <div class="prompt-sub">Sign in to choose which meets are scraped</div>

  <form class="auth-form" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    {% if form.errors %}
    <div class="form-error" role="alert">
      {% for error in form.non_field_errors %}{{ error }}{% empty %}Enter a username and password.{% endfor %}
    </div>
    {% endif %}

    <label class="field">
      <span class="field-label">Username</span>
      <input type="text" name="username" value="{{ form.username.value|default:'' }}"
             autocomplete="username" autocapitalize="none" autofocus required>
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <button class="btn" type="submit">Log in</button>
  </form>

</div>
</body>
</html>
