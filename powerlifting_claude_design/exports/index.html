<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IronCrawler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
  {% load static %}
  <style>
    :root {
      --ink:        #121420;
      --shadow:     #2c2b3c;
      --accent:     #c8f0ff;
      --text:       #dde6ed;
      --text-dim:   #6b7a8a;
      --text-faint: #3a4250;
      --glass-bg:     rgba(44, 43, 60, 0.45);
      --glass-border: rgba(200, 240, 255, 0.07);
      --glass-border-h: rgba(200, 240, 255, 0.22);
      --chip-bg:    rgba(27, 36, 50, 0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--ink);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 18px 80px;
    }

    /* ── Header ── */
    header { margin-bottom: 22px; }

    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.005em;
      line-height: 1;
      color: var(--text);
    }
    .wordmark span { color: var(--accent); }

    .tagline {
      font-family: 'Syne Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, var(--shadow), transparent);
      margin: 18px 0 16px;
    }

    /* ── Competition cards ── */
    .comp-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .comp-card {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      align-items: center;
      gap: 14px;
      height: 82px;                 /* every card the same size */
      padding: 0 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .comp-card:hover {
      border-color: var(--glass-border-h);
      background: rgba(64, 63, 76, 0.5);
    }

    /* Date chip (the only place the date is shown) */
    .card-date {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 13px;
      background: var(--chip-bg);
      border: 1px solid rgba(200, 240, 255, 0.06);
      flex-shrink: 0;
    }
    .date-num {
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);           /* neutral by default */
    }
    .date-mon {
      font-family: 'Syne Mono', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 3px;
    }

    /* Name — full name, capped at 2 lines so cards stay uniform */
    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
      text-wrap: pretty;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Countdown pill — neutral; only "today" is highlighted */
    .pill {
      font-family: 'Syne Mono', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--text-faint);
      color: var(--text-dim);
      background: rgba(27, 36, 50, 0.6);
    }

    /* TODAY state — the only highlight */
    .comp-card.is-today .date-num { color: var(--accent); }
    .comp-card.is-today .pill {
      border-color: rgba(200, 240, 255, 0.5);
      color: var(--accent);
      background: rgba(200, 240, 255, 0.1);
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 64px 0;
    }
    .empty p {
      font-family: 'Syne Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
  </style>
</head>
<body>

<div class="page">

  <header>
    <h1 class="wordmark">Iron<span>Crawler</span></h1>
    <p class="tagline">Upcoming &amp; Active Meets</p>
  </header>

  <div class="divider"></div>

  <div class="comp-list">
    {% if competitions %}
      {% for comp in competitions %}
      <a class="comp-card" href="{% url 'athlete_select' comp.comp_id %}">
        <div class="card-date">
          <div class="date-num">{{ comp.comp_date|date:"d" }}</div>
          <div class="date-mon">{{ comp.comp_date|date:"M" }}</div>
        </div>
        <div class="card-name">{{ comp.comp_name }}</div>
        <span class="pill" data-date="{{ comp.comp_date|date:'Y-m-d' }}">&mdash;</span>
      </a>
      {% endfor %}
    {% else %}
      <div class="empty">
        <p>No competitions loaded</p>
      </div>
    {% endif %}
  </div>

</div>

<script>
  // Countdown pills — only "today" gets highlighted
  document.querySelectorAll('.comp-card').forEach(function (card) {
    var el = card.querySelector('.pill');
    if (!el) return;
    var d = new Date(el.dataset.date + 'T00:00:00');
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var diff = Math.round((d - now) / 86400000);

    if (diff <= 0) {
      el.textContent = 'Today';
      card.classList.add('is-today');
    } else if (diff === 1) {
      el.textContent = 'Tomorrow';
    } else if (diff < 7) {
      el.textContent = 'in ' + diff + ' days';
    } else {
      var w = Math.round(diff / 7);
      el.textContent = 'in ' + w + (w === 1 ? ' wk' : ' wks');
    }
  });
</script>

</body>
</html>
