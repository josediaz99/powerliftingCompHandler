<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IronCrawler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'ironCrawler/style.css' %}">
</head>
<body>

<div class="page">

  <header>
    <h1 class="wordmark">Iron<span>Crawler</span></h1>
    <p class="tagline">Upcoming &amp; Active Meets</p>
  </header>

  <div class="divider"></div>

  <div class="comp-list">
    {% if competitions %}
      {% for comp in competitions %}
      <a class="card comp-card" href="{% url 'athlete_select' comp.comp_id %}">
        <div class="card-date">
          <div class="date-num">{{ comp.comp_date|date:"d" }}</div>
          <div class="date-mon">{{ comp.comp_date|date:"M" }}</div>
        </div>
        <div class="card-name">{{ comp.comp_name }}</div>
        <span class="pill" data-date="{{ comp.comp_date|date:'Y-m-d' }}">&mdash;</span>
      </a>
      {% endfor %}
    {% else %}
      <div class="empty show">No competitions loaded</div>
    {% endif %}
  </div>

</div>

<script src="{% static 'ironCrawler/countdown.js' %}"></script>
</body>
</html>
